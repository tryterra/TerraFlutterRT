name: Publish to pub.dev

# The regular flutter package (terra-flutter) has no CI and is published by
# hand; this adopts pub.dev's official automated publishing instead. Pushing a
# version tag (e.g. 0.2.4) publishes terra_flutter_rt via OIDC — no stored
# credential. Requires "Automated publishing" from GitHub to be enabled for
# this repo on the package's pub.dev admin page (tag pattern {{version}}).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for pub.dev OIDC authentication
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # setup-dart mints the pub.dev OIDC credential; flutter runs the publish
      # (a Flutter package cannot be published with plain `dart pub`).
      - uses: dart-lang/setup-dart@v1
      - name: Publish
        run: flutter pub publish --force
